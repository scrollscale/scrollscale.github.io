<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scrollscale</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  color: white;
}

/* popup */
.popup {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

button {
  padding: 15px 25px;
  margin: 10px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="popup">
  <h1>Choose language</h1>
  <button onclick="location.href='en.html'">English 🇬🇧</button>
  <button onclick="location.href='fi.html'">Suomi 🇫🇮</button>
</div>

</body>
</html>
